name: CodeQL

# Static analysis for code-level vulnerabilities — command injection, path traversal,
# unsafe deserialization — that the other scanners here do not look for: gitleaks finds
# committed secrets, govulncheck finds known-vulnerable dependencies, and neither reads
# this project's own logic.
#
# That logic is the part worth scanning. Baryo runs shell commands, applies diffs, writes
# files and resolves paths on behalf of a model, so an injection or traversal bug is
# reachable by anything that can influence a model's output.
#
# Findings land in the repository's Security tab and as annotations on the diff.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "design/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md", "design/**"]
  schedule:
    - cron: "27 3 * * 1" # weekly, so drift is caught without a push

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to the Security tab
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Buildless extraction, not autobuild. autobuild failed on this repository after
          # extracting 97 of 142 Go files, with go-extractor diagnostics and no error the
          # API's truncated log exposes — while the actions analysis in the same run, which
          # is buildless, succeeded with the same token. A heuristic build is the fragile
          # part here: internal/index has two parser implementations behind build tags, one
          # of them a cgo C library and the other a pure-Go module carrying bundled grammars,
          # so whichever configuration autobuild picks leaves the other unread.
          #
          # Buildless extraction reads the source instead of compiling it. That costs some
          # fidelity on generated or reflective code, and buys an analysis that does not
          # depend on guessing a build. If it turns out to read fewer files than autobuild
          # did, `build-mode: manual` with an explicit `go build ./...` is the next step.
          - language: go
            # `none` until 13 September 2026, when CodeQL started rejecting it outright:
            # "Go does not support the none build mode." Every run since has died in
            # Initialize CodeQL, before a single query, so the scan has been off while
            # showing a red check that reads like a finding. autobuild is still the wrong
            # answer for the reason above, so this is the explicit build the note below
            # already named as the next step.
            build-mode: manual
          # Every workflow in .github/ is executable configuration, and one of them runs
          # with repository credentials. CodeQL's actions pack reads them for the usual
          # mistakes: an unpinned action, a script interpolating untrusted input.
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Kept even though the Go analysis is buildless: extraction still resolves modules
      # with the toolchain, and pinning it to go.mod keeps that resolution the same as every
      # other job here rather than whatever the runner image ships.
      - if: matrix.language == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4e94bd11f71e507f7f87df81788dff88d1dacbfb # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended rather than the default pack: the default set is tuned to
          # keep noise low on any repository, and this one's whole job is executing
          # untrusted instructions against a filesystem.
          queries: security-extended

      # manual build mode means CodeQL observes this compile and extracts from it, so
      # every file that actually builds is read. The cgo parser in internal/index sits
      # behind a build tag; CGO_ENABLED=1 is the configuration the released binary uses,
      # and it is the one worth analysing.
      - name: Build for extraction
        if: matrix.language == 'go'
        env:
          CGO_ENABLED: "1"
        run: go build ./...

      - name: Analyze
        uses: github/codeql-action/analyze@4e94bd11f71e507f7f87df81788dff88d1dacbfb # v3
        with:
          category: "/language:${{ matrix.language }}"
