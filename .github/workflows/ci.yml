name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by release.yml so a tag cannot publish untested code.
  workflow_call:
  # Weekly re-run: govulncheck only sees new CVEs when it runs again.
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run tests (no CGO)
        run: CGO_ENABLED=0 go test -count=1 ./...

      - name: Run tests (CGO)
        # Source builds with a C toolchain use the cgo tree-sitter parsers, and
        # releases use the pure-Go ones above. This pass keeps the cgo path tested.
        run: CGO_ENABLED=1 go test -count=1 ./...

      - name: Run tests (race detector)
        run: go test -race -count=1 ./...

      - name: Build (no CGO)
        run: CGO_ENABLED=0 go build -ldflags "-s -w" -o baryo .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Test install.sh checksum verification
        run: sh scripts/install_test.sh

      # Builds through the release path, so a broken .goreleaser.yaml or a
      # release-only build flag is caught before a tag is pushed.
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: build --snapshot --single-target --clean

      - name: Check NOTICE is current
        run: |
          go mod download
          python3 scripts/gen_notice.py > /tmp/NOTICE.generated
          if ! diff -u NOTICE /tmp/NOTICE.generated; then
            echo "NOTICE is stale. Run: python3 scripts/gen_notice.py > NOTICE"
            exit 1
          fi
