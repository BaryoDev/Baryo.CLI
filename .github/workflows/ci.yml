name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run tests (no CGO)
        run: CGO_ENABLED=0 go test -count=1 ./...

      - name: Run tests (CGO)
        # The tree-sitter parsers in internal/index are cgo-only; without
        # this pass their tests never run in CI.
        run: CGO_ENABLED=1 go test -count=1 ./...

      - name: Run tests (race detector)
        run: go test -race -count=1 ./...

      - name: Build (no CGO)
        run: CGO_ENABLED=0 go build -ldflags "-s -w" -o baryo .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
