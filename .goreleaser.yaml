version: 2

project_name: baryo

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: baryo
    ldflags:
      - -s -w
      - -X github.com/arnelirobles/baryo-cli/internal/cli.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  # `formats` rather than the old singular `format`: goreleaser deprecated the latter, and a
  # deprecated property is a release that breaks on a tag push, at the least recoverable
  # moment. Same artifacts, same names.
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

# A bill of materials per archive, so what a published binary actually contains can be
# answered later without rebuilding it. NOTICE covers attribution; this covers versions,
# which is what a CVE advisory is phrased in terms of.
#
# Generated by syft from the archive rather than from go.mod: the question worth answering is
# what ended up in the artifact, and the build is where a dependency behind a build tag is
# either linked or left out. CI installs the same pinned syft and proves the output lists
# components, because a tool that writes an empty file still exits 0.
sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - repository:
      owner: BaryoDev
      name: Baryo.CLI
    directory: HomebrewFormula
    homepage: "https://github.com/BaryoDev/Baryo.CLI"
    description: "A local AI chat CLI powered by Docker Model Runner"
    license: "MIT"
    install: |
      bin.install "baryo"
    test: |
      assert_match "baryo version", shell_output("#{bin}/baryo --version")

scoops:
  - repository:
      owner: BaryoDev
      name: Baryo.CLI
    directory: ScoopBucket
    homepage: "https://github.com/BaryoDev/Baryo.CLI"
    description: "A local AI chat CLI powered by Docker Model Runner"
    license: "MIT"

release:
  github:
    owner: BaryoDev
    name: Baryo.CLI
