version: 2

project_name: baryo

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: baryo
    ldflags:
      - -s -w
      - -X github.com/arnelirobles/baryo-cli/internal/cli.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - repository:
      owner: arnelirobles
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/arnelirobles/baryo-cli"
    description: "A local AI chat CLI powered by Docker Model Runner"
    license: "MPL-2.0"
    install: |
      bin.install "baryo"
    test: |
      assert_match "baryo version", shell_output("#{bin}/baryo --version")

scoops:
  - repository:
      owner: arnelirobles
      name: scoop-baryo
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/arnelirobles/baryo-cli"
    description: "A local AI chat CLI powered by Docker Model Runner"
    license: "MPL-2.0"

release:
  github:
    owner: arnelirobles
    name: baryo-cli
